[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "woodor-agent-meeting"
version = "0.18.33"
description = "Cross-platform session and messaging runtime for Claude Code and Codex agents."
requires-python = ">=3.10"
dependencies = [
  "zeroconf>=0.132",
]

[project.scripts]
am = "agent_meeting.commands.am_cli:main"
am-ctl = "agent_meeting.commands.am_ctl_cli:main"
am-ctld = "agent_meeting.commands.am_ctld_cli:main"
amclaude = "agent_meeting.commands.amclaude_cli:main"
am-msgd = "agent_meeting.commands.am_msgd_cli:main"
am-update = "agent_meeting.commands.am_update_cli:main"
am-session-monitor = "agent_meeting.commands.session_monitor_cli:main"
am-statusline = "agent_meeting.ai_platforms.claude_code.meeting_status_line_process:main"
am-claude-session-start = "agent_meeting.ai_platforms.claude_code.session_start_bootstrap:main"

[project.gui-scripts]
am-ctld-service = "agent_meeting.operating_systems.windows_service_entrypoints:am_ctld_service_main"
am-msgd-service = "agent_meeting.operating_systems.windows_service_entrypoints:am_msgd_service_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
