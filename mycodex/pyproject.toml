[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "woodor-amcodex"
version = "0.18.16"
description = "Agent-meeting-aware Codex launcher and local session broker."
requires-python = ">=3.10"
dependencies = [
  "woodor-agent-meeting==0.18.16",
  "websockets>=15",
]

[project.scripts]
amcodex = "mycodex.commands.amcodex_cli:main"
am-codexd = "mycodex.commands.am_codexd_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
